<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>登录 - 昕邦智能装备机器人物联网管控平台</title>
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Local TailwindCSS with fallback -->
    <script src="/static/tailwindcss.js" onerror="this.onerror=null;this.src='https://cdn.tailwindcss.com';"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: #F8FAFC;
            color: #0F172A;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .dark body, body.dark, html.dark body {
            background-color: #0B0F19 !important;
            color: #F8FAFC !important;
        }

        .clean-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark .clean-card, html.dark .clean-card {
            background: #111827 !important;
            border-color: #1F2937 !important;
            color: #F8FAFC !important;
            box-shadow: 0 4px 25px -2px rgba(0, 0, 0, 0.4) !important;
        }

        .dark .border-slate-200, html.dark .border-slate-200 {
            border-color: #1F2937 !important;
        }
        .dark .text-slate-900, html.dark .text-slate-900 {
            color: #F8FAFC !important;
        }
        .dark .text-slate-700, html.dark .text-slate-700 {
            color: #E2E8F0 !important;
        }
        .dark .text-slate-500, html.dark .text-slate-500 {
            color: #94A3B8 !important;
        }
        .dark input, html.dark input {
            background-color: #1E293B !important;
            border-color: #334155 !important;
            color: #F8FAFC !important;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-[#F8FAFC] dark:bg-[#0B0F19]">

    <!-- Main Clean Centered Login Card -->
    <div class="clean-card rounded-2xl w-full max-w-md p-6 sm:p-8 shadow-xl border border-slate-200 dark:border-slate-800 relative">
        
        <!-- Compact Theme Toggle Button in Top Right Corner -->
        <div class="absolute top-5 right-5">
            <button id="themeToggleBtn" onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-amber-400 border border-slate-200 dark:border-slate-700 transition flex items-center justify-center shrink-0" title="切换明暗主题模式">
                <!-- Sun icon in dark mode -->
                <svg id="themeIconSun" class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                <!-- Moon icon in light mode -->
                <svg id="themeIconMoon" class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            </button>
        </div>

        <!-- Header: Logo & Brand Title -->
        <div class="mb-6">
            <div class="flex items-center gap-2.5 mb-2">
                <div class="w-8 h-8 rounded-lg bg-slate-900 dark:bg-slate-800 text-white flex items-center justify-center shadow-sm shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-base font-bold text-slate-900 dark:text-slate-100 tracking-tight">昕邦智能装备</h2>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 font-mono leading-none">机器人物联网管控平台</p>
                </div>
            </div>
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-2">请输入账号密码进入系统管理后台</p>
        </div>

        <!-- Tab Switcher -->
        <div class="flex items-center gap-6 border-b border-slate-200 dark:border-slate-800 pb-2 mb-5 text-xs font-medium">
            <button id="tabBtnLogin" onclick="switchTab('login')" class="font-bold text-slate-900 dark:text-slate-100 border-b-2 border-slate-900 dark:border-slate-100 pb-2 transition">账号登录</button>
            <button id="tabBtnRegister" onclick="switchTab('register')" class="font-medium text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100 border-b-2 border-transparent pb-2 transition">新用户注册</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1.5">系统账号</label>
                <input type="text" id="loginUsername" required class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 text-xs rounded-lg px-3.5 py-2.5 focus:ring-1 focus:ring-slate-900 dark:focus:ring-slate-400 focus:outline-none" placeholder="输入用户名或工号">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label class="block text-xs font-medium text-slate-700 dark:text-slate-300">登录密码</label>
                </div>
                <input type="password" id="loginPassword" required class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 text-xs rounded-lg px-3.5 py-2.5 focus:ring-1 focus:ring-slate-900 dark:focus:ring-slate-400 focus:outline-none" placeholder="输入登录密码">
            </div>

            <div id="loginErrorBox" class="hidden p-2.5 rounded-lg bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-400 text-xs"></div>

            <button type="submit" id="btnLoginSubmit" class="w-full py-2.5 rounded-lg bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 text-white font-medium text-xs shadow-sm transition mt-1">
                进入管控大屏 →
            </button>
        </form>

        <!-- Register Form -->
        <form id="registerForm" onsubmit="handleRegister(event)" class="hidden space-y-3.5">
            <div>
                <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">设置用户名</label>
                <input type="text" id="regUsername" required class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 text-xs rounded-lg px-3.5 py-2 focus:ring-1 focus:ring-slate-900 dark:focus:ring-slate-400 focus:outline-none" placeholder="至少 3 位字符">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">设置密码</label>
                <input type="password" id="regPassword" required class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 text-xs rounded-lg px-3.5 py-2 focus:ring-1 focus:ring-slate-900 dark:focus:ring-slate-400 focus:outline-none" placeholder="至少 4 位密码">
            </div>
            <div>
                <label class="block text-xs font-medium text-slate-700 dark:text-slate-300 mb-1">姓名 / 岗位</label>
                <input type="text" id="regRealName" class="w-full bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-slate-900 dark:text-slate-100 text-xs rounded-lg px-3.5 py-2 focus:ring-1 focus:ring-slate-900 dark:focus:ring-slate-400 focus:outline-none" placeholder="例：张工 / 操作员">
            </div>
            <div id="regErrorBox" class="hidden p-2.5 rounded-lg bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-800 text-rose-700 dark:text-rose-400 text-xs"></div>
            <button type="submit" id="btnRegSubmit" class="w-full py-2 rounded-lg bg-slate-900 hover:bg-slate-800 dark:bg-slate-100 dark:hover:bg-white dark:text-slate-900 text-white font-medium text-xs shadow-sm transition mt-1">
                完成注册
            </button>
        </form>

        <div class="pt-4 mt-6 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-[11px] text-slate-400 dark:text-slate-500 font-mono">
            <span>安全连接认证</span>
            <span>v4.2-PRO</span>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // -------------------------------------------------------------
        // Theme Management (Default Light, Persistent Dark Toggle)
        // -------------------------------------------------------------
        function initTheme() {
            const savedTheme = localStorage.getItem('app_theme') || 'light';
            const isDark = (savedTheme === 'dark');
            if (isDark) {
                document.documentElement.classList.add('dark');
                document.body.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
                document.body.classList.remove('dark');
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.body.classList.toggle('dark', isDark);
            localStorage.setItem('app_theme', isDark ? 'dark' : 'light');
        }
        initTheme();

        function switchTab(tab) {
            const isLogin = tab === 'login';
            document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
            document.getElementById('registerForm').classList.toggle('hidden', isLogin);
            
            document.getElementById('tabBtnLogin').className = isLogin 
                ? 'font-bold text-slate-900 dark:text-slate-100 border-b-2 border-slate-900 dark:border-slate-100 pb-2 transition' 
                : 'font-medium text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100 border-b-2 border-transparent pb-2 transition';
            document.getElementById('tabBtnRegister').className = !isLogin 
                ? 'font-bold text-slate-900 dark:text-slate-100 border-b-2 border-slate-900 dark:border-slate-100 pb-2 transition' 
                : 'font-medium text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-slate-100 border-b-2 border-transparent pb-2 transition';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('loginUsername').value.trim();
            const p = document.getElementById('loginPassword').value.trim();
            const errBox = document.getElementById('loginErrorBox');
            const btn = document.getElementById('btnLoginSubmit');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = '正在验证安全凭证...';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (data.code === 200) {
                    localStorage.setItem('robot_token', data.data.token);
                    localStorage.setItem('robot_user', JSON.stringify(data.data.user));
                    window.location.href = '/';
                } else {
                    errBox.innerText = data.message || '登录失败，请检查工号或密码';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.innerText = '服务器通信失败: ' + err.message;
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = '进入管控大屏 →';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const u = document.getElementById('regUsername').value.trim();
            const p = document.getElementById('regPassword').value.trim();
            const name = document.getElementById('regRealName').value.trim();
            const errBox = document.getElementById('regErrorBox');
            const btn = document.getElementById('btnRegSubmit');

            errBox.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = '正在注册...';

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p, real_name: name })
                });
                const data = await res.json();
                if (data.code === 200) {
                    alert('注册成功！已自动为您登录');
                    localStorage.setItem('robot_token', data.data.token);
                    localStorage.setItem('robot_user', JSON.stringify(data.data.user));
                    window.location.href = '/';
                } else {
                    errBox.innerText = data.message || '注册失败';
                    errBox.classList.remove('hidden');
                }
            } catch (err) {
                errBox.innerText = '服务器通信失败: ' + err.message;
                errBox.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerText = '完成注册';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initTheme();
        });
    </script>
</body>
</html>
